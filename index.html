<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建筑规范查询</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#fff;color:#1f2328;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 32px}
h1{font-size:20px;font-weight:600;margin:28px 0 18px;letter-spacing:.2px}
#q{
  width:100%;height:44px;padding:0 14px;
  font-size:15px;font-family:inherit;color:inherit;
  border:1px solid #d0d7de;border-radius:8px;background:#fff;outline:none;
  transition:border-color .15s;
}
#q:focus{border-color:#0969da}
#q::placeholder{color:#8b949e}
.cats{display:flex;gap:8px;margin:14px 0 2px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:6px 14px;font-size:14px;font-family:inherit;
  color:#57606a;background:#fff;border:1px solid #d0d7de;border-radius:999px;
  cursor:pointer;white-space:nowrap;transition:.15s;
}
.chip:hover{border-color:#afb8c1}
.chip.on{color:#fff;background:#0969da;border-color:#0969da}
.item{border:1px solid #e5e9ef;border-radius:10px;padding:14px 16px;margin-top:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;color:#57606a;background:#f6f8fa;border-radius:4px;padding:2px 7px;
}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.green{color:#1a7f37;background:#dafbe1}
.tag.red{color:#cf222e;background:#ffebe9}
.tag.orange{color:#9a6700;background:#fff8c5}
.name{font-size:16px;font-weight:600;line-height:1.5;margin:10px 0 12px}
.btn{
  padding:5px 12px;font-size:13px;font-family:inherit;color:#57606a;
  background:#fff;border:1px solid #d0d7de;border-radius:6px;cursor:pointer;transition:.15s;
}
.btn:hover{background:#f6f8fa}
.detail{margin-top:14px;padding-top:12px;border-top:1px dashed #e5e9ef}
.detail h3{font-size:13px;font-weight:600;color:#8b949e;margin:0 0 6px}
.detail p{margin:0 0 14px;font-size:14px;line-height:1.75}
.detail ul{margin:0;padding-left:18px}
.detail li{font-size:14px;line-height:1.75;margin-bottom:4px}
.empty{padding:48px 0;text-align:center;color:#8b949e;font-size:14px}
.foot{margin-top:28px;text-align:center;font-size:12px;color:#8b949e}
</style>
</head>
<body>
<div class="wrap">
  <h1>建筑规范查询</h1>
  <input id="q" type="text" placeholder="搜索规范名称或编号" autocomplete="off">
  <div class="cats" id="cats"></div>
  <main id="list"></main>
  <div class="foot">数据核对日期：2026年10月</div>
</div>
<script>
var DATA = [
  {
    id: 1,
    cat: '施工验收',
    code: 'JGJ/T46-2024',
    name: '建筑与市政工程施工现场临时用电安全技术标准',
    status: '现行有效',
    scene: '适用于新建、改建、扩建的工业与民用建筑和市政基础设施施工现场临时用电工程。',
    points: [
      '6.2.5 电缆直接埋地敷设的深度不应小于 0.7m，且应在电缆周围均匀铺垫不小于 50mm 厚的细砂。',
      '6.2.7 埋地电缆与其附近外电电缆和管沟的平行间距不应小于 2m。',
      '6.3.3 室内明敷设主干线距地面不应小于 2.5m。',
      '7.1.4 电动建筑机械和手持电动工具的电缆线路应符合相应规定。',
      '7.2.6 塔身高于 30m 的塔式起重机，应在塔顶和臂架端部设红色信号灯。',
      '7.4.5 多台夯土机械并列工作时，间距不应小于 5m。',
      '7.5.4 电焊机械的二次线应采用防水橡皮护套铜芯软电缆，电缆长度不应大于 30m，不得采用金属构件或主体结构钢筋代替二次线的中性导体。',
      '7.6.5 手持电动工具应满足规定的绝缘电阻限值要求。',
      '8.1.2 在施工程（含脚手架）的周边与架空线路的边线之间应满足最小安全操作距离。',
      '9.2.2 灯具离地面高度小于 2.5m 场所的照明，电源电压不应大于 AC 36V。'
    ]
  },
  {
    id: 2,
    cat: '施工验收',
    code: 'GB50194-2014',
    name: '建设工程施工现场供用电安全规范',
    status: '现行有效',
    scene: '适用于一般工业与民用建筑施工现场电压在 10kV 及以下的供用电设施的设计、施工、运行、维护及拆除；不适用于水下、井下和矿井等工程。',
    points: [
      '4.0.4、8.1.10、8.1.12、10.2.4、10.2.7、11.2.3、11.4.2 为强制性条文，必须严格执行。',
      '8.1.1 低压接地型式可采用 TN-S、TN-C-S、TT 三种系统。',
      '8.1.2 TN-S 系统的 PE 线应做重复接地。',
      '6.1.1 宜采用总配电箱—分配电箱—末级配电箱三级配电。',
      '6.3.17 送电顺序：总配电箱 → 分配电箱 → 末级配电箱；停电反向操作。',
      '6.4.7 末级配电箱剩余电流保护器额定动作电流 ≤30mA、动作时间 ≤0.1s。',
      '6.4.8 剩余电流保护器应每月至少检测一次。',
      '4.0.4 发电机组电源必须与外电源闭锁，严禁并列运行。',
      '7.5 外电线路防护：无法满足安全距离时应采取隔离、停电或迁改措施。',
      '10.2.4 严禁 220V 灯具充当行灯。',
      '10.2.5 潮湿等特殊场所应采用 SELV 安全特低电压。',
      '10.2.7 行灯变压器不得带入金属容器内。',
      '11.2.3 易燃易爆区域检修严禁带电作业。',
      '11.4.2 潮湿环境严禁带电检修。',
      '8.1.10 PE 导体严禁装设开关、熔断器。',
      '8.1.12 严禁可燃介质金属管道用作 PE 保护导体。',
      '12.0.3 明确供用电设施巡视、接地与保护器检测周期。',
      '13 章 设施拆除应执行专项方案，先断电隔离，落实安全技术措施。'
    ]
  }
];

var CATS = ['全部', '民用建筑', '结构', '防火', '施工验收'];
var currentCat = '全部';
var openIds = {};

var listEl = document.getElementById('list');
var qEl = document.getElementById('q');
var catsEl = document.getElementById('cats');

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m];
  });
}

function statusClass(s) {
  if (s.indexOf('废止') > -1) return 'red';
  if (s.indexOf('修订') > -1) return 'orange';
  return 'green';
}

function buildChips() {
  CATS.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (c === currentCat ? ' on' : '');
    b.textContent = c;
    b.setAttribute('data-cat', c);
    catsEl.appendChild(b);
  });
}

function detailHTML(d) {
  return '<div class="detail">' +
      '<h3>适用场景</h3>' +
      '<p>' + esc(d.scene) + '</p>' +
      '<h3>核心条文摘要</h3>' +
      '<ul>' + d.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
    '</div>';
}

function render() {
  var q = qEl.value.trim().toLowerCase();
  var items = DATA.filter(function (d) {
    if (currentCat !== '全部' && d.cat !== currentCat) return false;
    if (!q) return true;
    return d.name.toLowerCase().indexOf(q) > -1 || d.code.toLowerCase().indexOf(q) > -1;
  });

  if (!items.length) {
    listEl.innerHTML = '<div class="empty">未找到相关规范</div>';
    return;
  }

  listEl.innerHTML = items.map(function (d) {
    var open = !!openIds[d.id];
    return '<article class="item">' +
        '<div class="head">' +
          '<span class="code">' + esc(d.code) + '</span>' +
          '<span class="tag ' + statusClass(d.status) + '">' + esc(d.status) + '</span>' +
        '</div>' +
        '<h2 class="name">' + esc(d.name) + '</h2>' +
        '<button type="button" class="btn" data-toggle="' + d.id + '">' + (open ? '收起' : '查看原文') + '</button>' +
        (open ? detailHTML(d) : '') +
      '</article>';
  }).join('');
}

catsEl.addEventListener('click', function (e) {
  var b = e.target.closest('.chip');
  if (!b) return;
  currentCat = b.getAttribute('data-cat');
  Array.prototype.forEach.call(catsEl.children, function (x) {
    x.classList.toggle('on', x === b);
  });
  render();
});

listEl.addEventListener('click', function (e) {
  var b = e.target.closest('[data-toggle]');
  if (!b) return;
  var id = b.getAttribute('data-toggle');
  if (openIds[id]) { delete openIds[id]; } else { openIds[id] = true; }
  render();
});

qEl.addEventListener('input', render);

buildChips();
render();
</script>
</body>
</html>
